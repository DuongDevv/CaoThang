# Zone giới hạn Rate Limit (10 requests/s mỗi IP)
limit_req_zone $binary_remote_addr zone=cms_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression tối ưu băng thông
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security Headers (Chuẩn Doanh Nghiệp)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    location / {
        limit_req zone=cms_limit burst=20 nodelay;
        # Routing cho React SPA (Fallback về index.html nếu không tìm thấy file)
        try_files $uri $uri/ /index.html;
    }

    # Cache cho Static Assets (1 year cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
