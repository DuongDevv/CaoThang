version: '3.8'

services:
  news-cms-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_cms_ui_app
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
