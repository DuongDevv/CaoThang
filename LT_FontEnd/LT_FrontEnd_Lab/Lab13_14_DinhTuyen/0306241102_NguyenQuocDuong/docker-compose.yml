version: '3.8'

services:
  lab13-14-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab13_14_routing_auth_app
    ports:
      - "3000:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
